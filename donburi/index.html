<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>薇薇丼飯 組一碗｜風格研究所 工具實驗室</title>
<link rel="icon" href="../assets/logo.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：俯視木桌，左邊一只碗（蓋子可掀），右邊點餐單一路印出來；下方一排配料托盤。單一深木色調。 */
:root{
  --wood:#3A2A20; --wood2:#4B3628; --ink:#F4EDE3; --muted:#C9B9A6; --fire:#D9652B; --paper:#F7F1E7; --pink:#2C2420; --line:rgba(244,237,227,.16);
  --f-d:"Noto Serif TC","Songti TC",serif; --f-b:"Noto Sans TC","PingFang TC",sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:repeating-linear-gradient(92deg,var(--wood) 0 22px,var(--wood2) 22px 25px,var(--wood) 25px 60px);color:var(--ink);font-family:var(--f-b)}
.wrap{max-width:1000px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;align-items:end;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-d);font-weight:900;font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:.06em}
h1 em{font-style:normal;color:var(--fire)}
.sub{color:var(--muted);font-size:14px}
.warn{font-size:12px;color:var(--muted);border:1px dashed var(--muted);border-radius:8px;padding:4px 10px;margin-left:auto}
.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:780px){.stage{grid-template-columns:1fr}}
.stage>*{min-width:0}
.bowlbox{display:grid;place-items:center;padding:10px 0 30px;position:relative;overflow:clip}
.bowl{position:relative;width:min(340px,82vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1b1715 0 60%,#2a2421 61% 66%,#0f0d0c 67% 100%);box-shadow:0 30px 40px -18px rgba(0,0,0,.7),inset 0 0 0 6px #8a2f1c;transition:transform .2s}
.bowl.hot{transform:scale(1.03)}
.inside{position:absolute;inset:12%;border-radius:50%;overflow:hidden}
.layer{position:absolute;inset:0;opacity:0;transform:scale(.4) translateY(-40px);transition:opacity .3s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.layer.in{opacity:1;transform:none}
.rice{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 2px,transparent 3px) 0 0/11px 9px,radial-gradient(circle at 60% 70%,#efe9dc 0 2px,transparent 3px) 0 0/9px 12px,#f4f0e6}
.rice.purple{background:radial-gradient(circle at 30% 30%,#9a6b8f 0 2px,transparent 3px) 0 0/11px 9px,radial-gradient(circle at 60% 70%,#f2e7ee 0 2px,transparent 3px) 0 0/9px 12px,#d9c3cf}
.pc{position:absolute;width:24%;height:15%;border-radius:40% 45% 35% 50%}
.chicken .pc{background:linear-gradient(135deg,#c98a45,#8f5a2a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.pork .pc{background:repeating-linear-gradient(90deg,#f1d8c3 0 5px,#b0653e 5px 12px)}
.beef .pc{background:linear-gradient(135deg,#8a3b2a,#5a2318)}
.lamb .pc{background:linear-gradient(135deg,#9b5a3a,#5e3322);border-radius:50%;width:16%;height:16%}
.egg{position:absolute;left:38%;top:36%;width:30%;height:28%;border-radius:48% 52% 45% 55%;background:#fbf8f1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.egg::after{content:"";position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd36b,#f29a17)}
.scal i{position:absolute;width:5%;height:5%;border-radius:50%;background:#5f9d3a;box-shadow:inset 0 0 0 2px #9ccc6a}
.nori i{position:absolute;width:22%;height:6%;background:#1f2b1f;border-radius:2px}
.corn i{position:absolute;width:5%;height:5%;border-radius:30%;background:#f4c542}
.sauce svg{width:100%;height:100%}
.sauce path{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900}
.sauce.in path{animation:pour 1.2s ease-out forwards}
@keyframes pour{to{stroke-dashoffset:0}}
.lid{position:absolute;inset:-2%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#b23a22,#6e1f12 70%);display:grid;place-items:center;box-shadow:0 20px 30px -10px rgba(0,0,0,.6);transition:transform .9s cubic-bezier(.6,-0.2,.3,1),opacity .9s;z-index:5;cursor:pointer;border:0;color:var(--ink);font:inherit}
.lid b{font-family:var(--f-d);font-size:44px;letter-spacing:.2em;display:block}
.lid span{font-size:13px;opacity:.8}
.lid.off{transform:translate(70%,-60%) rotate(35deg) scale(.7);opacity:0;pointer-events:none}
.skewers{position:absolute;right:-4%;bottom:2%;display:grid;gap:6px;z-index:3}
.sk{width:120px;height:14px;position:relative;animation:drop .4s cubic-bezier(.3,1.6,.5,1)}
.sk::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:#d8c09a}
.sk::after{content:"";position:absolute;left:14px;top:0;width:76px;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,#8b4a2c 0 16px,#5b2d18 16px 19px)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.steps{display:grid;gap:14px}
.step h2{font-family:var(--f-d);font-size:18px;margin:0 0 8px;font-weight:600}
.step h2 small{font-family:var(--f-b);color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:14px;background:rgba(244,237,227,.08);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:transform .15s,background .2s}
.opt:hover{transform:translateY(-2px)}
.opt.on{background:var(--fire);border-color:var(--fire)}
.opt .pr{font-size:12px;opacity:.8}
.opt:focus-visible,.go:focus-visible,.lid:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.receipt{background:var(--paper);color:#2C2420;border-radius:4px;padding:16px 16px 22px;font-size:14px;display:grid;gap:6px;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x}
.rt{text-align:center;font-family:var(--f-d);font-weight:900;font-size:20px;letter-spacing:.3em}
.rs{text-align:center;font-size:11px;color:#7a6a5c;letter-spacing:.1em}
.dash{border-top:1px dashed #b9a893}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;animation:print .3s ease-out}
@keyframes print{from{opacity:0;transform:translateY(-6px)}}
.dim{color:#8c7b6b}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total b{font-size:28px;font-family:var(--f-d)}
.flash{animation:fl .45s}@keyframes fl{50%{color:var(--fire);transform:scale(1.12)}}
#tot{display:inline-block}
.stamp{position:absolute;right:16px;top:44%;transform:rotate(-14deg);border:3px solid var(--fire);color:var(--fire);border-radius:50%;width:88px;height:88px;display:grid;place-items:center;text-align:center;font-family:var(--f-d);font-weight:900;font-size:15px;line-height:1.2;animation:stamp .4s cubic-bezier(.3,1.6,.5,1);opacity:.9}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.6);opacity:0}}
.go{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:12px;background:#2C2420;color:var(--paper);cursor:pointer;margin-top:6px}
.go:disabled{opacity:.35;cursor:default}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

document.querySelectorAll('.opts').forEach(box=>{const g=box.dataset.g;M[g].forEach(it=>{const b=document.createElement('button');b.className='opt';b.id='o-'+g+'-'+it.k;
 b.innerHTML=it.n+'<span class="pr">'+(it.p?'+'+it.p:'免費')+'</span>';
 b.onclick=()=>{if(!st.open)openLid();
  if(g==='sk'){st.sk.push(it);}
  else if(box.dataset.one){st[g]=st[g]===it?null:it;box.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b&&st[g]===it));}
  else{st.top.has(it)?st.top.delete(it):st.top.add(it);b.classList.toggle('on',st.top.has(it));}
  bump();render();};box.appendChild(b)})});
function openLid(){st.open=true;$('lid').classList.add('off');render()}
$('lid').onclick=openLid;
function bump(){const b=$('bowl');b.classList.add('hot');setTimeout(()=>b.classList.remove('hot'),180)}
function render(){
 const R=$('L-rice');R.className='layer rice'+(st.rice?' in':'')+(st.rice&&st.rice.k==='purple'?' purple':'');
 const ME=$('L-meat');if(st.meat){if(ME.dataset.k!==st.meat.k){ME.dataset.k=st.meat.k;ME.className='layer '+st.meat.k;ME.innerHTML='';
   const im=document.createElement('img');im.alt='';im.src=MI[st.meat.k];ME.appendChild(im);
   requestAnimationFrame(()=>requestAnimationFrame(()=>ME.classList.add('in')))}}else{ME.className='layer';ME.dataset.k=''}
 ['egg','scal','nori','corn'].forEach(k=>$('L-'+k).classList.toggle('in',[...st.top].some(t=>t.k===k)));
 const S=$('L-sauce');if(st.sauce){$('sp').style.stroke=st.sauce.c;if(!S.classList.contains('in')||S.dataset.k!==st.sauce.k){S.classList.remove('in');void S.offsetWidth;S.dataset.k=st.sauce.k;S.classList.add('in')}}else S.classList.remove('in');
 const K=$('sks');while(K.children.length<st.sk.length){const d=document.createElement('div');d.className='sk '+st.sk[K.children.length].k;K.appendChild(d)}
 const rows=[];
 if(st.rice)rows.push([st.rice.n,st.rice.p]);
 if(st.meat)rows.push([st.meat.n+'丼',st.meat.p]);
 st.top.forEach(t=>rows.push(['＋'+t.n,t.p,1]));
 if(st.sauce)rows.push(['＋'+st.sauce.n,0,1]);
 const cnt={};st.sk.forEach(s=>{(cnt[s.n]=cnt[s.n]||{p:s.p,q:0}).q++});
 Object.entries(cnt).forEach(([n,v])=>rows.push([n+' × '+v.q,v.p*v.q]));
 $('lines').innerHTML=rows.length?rows.map(r=>'<div class="row'+(r[2]?' dim':'')+'"><span>'+r[0]+'</span><span>'+(r[1]?r[1]:'—')+'</span></div>').join(''):'<div class="row dim">'+(st.open?'從 ① 飯底開始選':'先掀開碗蓋，開始組你的丼')+'</div>';
 count(rows.reduce((a,r)=>a+r[1],0));
 $('go').disabled=!(st.rice&&st.meat);$('go').textContent='送出點餐';$('st').innerHTML='';
}
function count(to){const el=$('tot'),from=shown,t0=performance.now();shown=to;if(from===to)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
 (function step(t){const k=Math.min(1,(t-t0)/400);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(step)})(t0)}
$('go').onclick=()=>{$('st').innerHTML='<span class="stamp">薇薇<br>已點餐</span>';$('go').textContent='點餐完成，現烤中🔥';$('go').disabled=true};
render();
})();
</script>
